    <!-- Prefer custom domain over Firebase default hosts (web.app / firebaseapp.com). -->
    <script>
      (function () {
        var h = location.hostname
        if (
          h === 'ultraplaner.com' ||
          h === 'www.ultraplaner.com' ||
          h === 'localhost' ||
          h === '127.0.0.1'
        ) {
          return
        }
        if (!/\.web\.app$/.test(h) && !/\.firebaseapp\.com$/.test(h)) return
        var robots = document.querySelector('meta[name="robots"]')
        if (!robots) {
          robots = document.createElement('meta')
          robots.setAttribute('name', 'robots')
          document.head.appendChild(robots)
        }
        robots.setAttribute('content', 'noindex, nofollow')
        // Keep Firebase reserved URLs and OAuth callbacks on their host.
        if (location.pathname.indexOf('/__/') === 0) return
        if (location.pathname.indexOf('/oauth/') === 0) return
        location.replace('https://ultraplaner.com' + location.pathname + location.search + location.hash)
      })()
    </script>
